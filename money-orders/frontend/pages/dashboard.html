<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="main-title">Money Order</div>
            <nav>
                <a href="#home">Home</a>
<!--                <a href="#register">Register</a>-->
                <a href='../index.html'>Login</a>
            </nav>
        </header>
        <main>
            <div class="container mt-4">
                <div class="row gap-3 mb-4">
                    <div class="col-12 col-md-5 p-3 border border-dark border-2 rounded me-auto">
                        <div class="">
                            <div id="avatar" class="avatar avatar-subtle theme-accent"></div>
                            <div id="user_name" class="fs-xl"></div>
                        </div>
                        <div id="user_email" class="fst-italic text-secondary mt-4"></div>
                        <div id="user_role" class="fs-s fst-italic"></div>
                    </div>
                    <div class="col-12 col-md-5 p-3 border border-dark border-2 rounded ms-auto">
                        <div>Account Number</div>
                        <div id="user_account" class="fs-lg text-secondary"></div>
                        <div class="mt-4">Current Balance</div>
                        <div id="account_balance" class="fs-lg"></div>
                    </div>
                </div>
                <div class="row gap-4">
                    <div class="col-12 col-md-5 border border-dark border-2 rounded pt-2 me-auto">
                        <div class="title h4">Deposit Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-deposit-to">To:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-deposit-to">

                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="deposit-amount">Amount:</label>
                                <input type="text" class="form-control" id="deposit-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button id="deposit" class="btn btn-success">Deposit</button>
                            </div>
                        </form>
                    </div>
                    <div class="col-12 col-md-5 border border-dark border-2 rounded pt-2 ms-auto">
                        <div class="title h4">Withdrawal Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-withdraw-from">From:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-withdraw-from">

                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="withdraw-amount">Amount:</label>
                                <input type="text" class="form-control" id="withdraw-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button class="btn btn-danger" id="withdraw">Withdraw</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12 col-md-12 border border-dark border-2 rounded pt-2">
                        <div class="title h4">Transfer Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-transfer-from">From:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-transfer-from">

                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="select-transfer-to">To:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-transfer-to">

                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="transfer-amount">Amount:</label>
                                <input type="text" class="form-control" id="transfer-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button id="transfer" class="btn btn-warning">Transfer</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="title h3">Transaction History</div>
                    <div class="">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="transactions">
                                <tr>
                                    <td>Deposit</td>
                                    <td>-</td>
                                    <td>Person 2</td>
                                    <td class="text-success">1000</td>
                                    <td class="text-success">Completed</td>
                                </tr>
                                <tr>
                                    <td>Withdraw</td>
                                    <td>Person 1</td>
                                    <td>-</td>
                                    <td class="text-danger">600</td>
                                    <td class="text-success">Completed</td>
                                </tr>
                                <tr>
                                    <td>Transfer</td>
                                    <td>Person 1</td>
                                    <td>Person 2</td>
                                    <td class="text-warning">500</td>
                                    <td class="text-success">Completed</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item">
                        <a class="page-link" href="#" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </main>
        <footer>
            <button class="btn btn-danger" id="logout">Log Out</button>
        </footer>
    </div>
    <script src="../js/dashboard.js"></script>
</body>
</html>

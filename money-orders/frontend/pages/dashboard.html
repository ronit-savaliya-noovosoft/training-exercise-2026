<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="main-title">Money Order</div>
            <nav>
                <a href="#home">Home</a>
<!--                <a href="#register">Register</a>-->
                <a href='../index.html'>Login</a>
            </nav>
        </header>
        <main>
            <div class="container mt-4">
                <div class="row gap-4">
                    <div class="col-12 col-md-5 border border-dark border-2 rounded pt-2 me-auto">
                        <div class="title h4">Deposit Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-deposit-to">To:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select" id="select-deposit-to">
                                        <option selected>Choose Username</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="deposit-amount">Amount:</label>
                                <input type="text" class="form-control" id="deposit-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button type="deposit" class="btn btn-success">Deposit</button>
                            </div>
                        </form>
                    </div>
                    <div class="col-12 col-md-5 border border-dark border-2 rounded pt-2 ms-auto">
                        <div class="title h4">Withdrawal Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-withdraw-from">From:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select" id="select-withdraw-from">
                                        <option selected>Choose Username</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="withdraw-amount">Amount:</label>
                                <input type="text" class="form-control" id="withdraw-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button type="withdraw" class="btn btn-danger">Withdraw</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12 col-md-12 border border-dark border-2 rounded pt-2">
                        <div class="title h4">Transfer Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-transfer-from">From:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select" id="select-transfer-from">
                                        <option selected>Choose Username</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="select-transfer-to">To:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select" id="select-transfer-to">
                                        <option selected>Choose Username</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="transfer-amount">Amount:</label>
                                <input type="text" class="form-control" id="transfer-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button type="transfer" class="btn btn-warning">Transfer</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="title h3">Transaction History</div>
                    <div class="">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Deposit</td>
                                    <td>-</td>
                                    <td>Person 2</td>
                                    <td class="text-success">1000</td>
                                </tr>
                                <tr>
                                    <td>Withdraw</td>
                                    <td>Person 1</td>
                                    <td>-</td>
                                    <td class="text-danger">600</td>
                                </tr>
                                <tr>
                                    <td>Transfer</td>
                                    <td>Person 1</td>
                                    <td>Person 2</td>
                                    <td class="text-warning">500</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer>

        </footer>
    </div>
</body>
</html>

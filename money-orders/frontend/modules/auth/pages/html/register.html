<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../../../styles.css"/>
</head>
<body>
    <div class="login-form w-6 my-5">
        <form class="w-50 m-auto p-5 border border-2 border-dark rounded">
            <div class="title h2 text-center mb-3">
                Welcome!
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
            </div>

            <div class="mb-2">
                <a href="login.html">Already have an account?</a>
            </div>

            <button type="submit" id="register" class="btn btn-primary">
                <a href="login.html" class="text-light text-decoration-none">Register</a>
            </button>

            <div class="mt-3 text-danger" id="signup-message"></div>
        </form>
    </div>
    <script src="../js/register.js" type="module"></script>
</body>
</html>

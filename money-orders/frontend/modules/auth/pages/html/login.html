<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../../../styles.css"/>
</head>
<body>
    <div class="contsiner min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0 rounded-4" style="max-width: 430px; width: 100%">
            <div class="card-body p-4 p-md-5">
                <form>
                    <div class="title h2 text-center mb-3">
                        Welcome Back!
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp" required>
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>

                    <div class="mb-2 d-flex flex-row gap-5">
                        <a href="register.html">New on money order?</a>
                        <a href="forgotPassword.html">Forgot password?</a>
                    </div>
                    <button type="submit" id="login" class="btn btn-primary">
                        Login
                    </button>
                    <div class="mt-4 text-danger" id="login-message"></div>
                </form>

            </div>
        </div>
    </div>
    <script src="../js/login.js" type="module"></script>
</body>
</html>

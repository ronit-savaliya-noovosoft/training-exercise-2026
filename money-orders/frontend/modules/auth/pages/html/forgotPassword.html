<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../../../styles.css"/>
</head>
<body>
    <div class="contsiner min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0 rounded-4" style="max-width: 430px; width: 100%">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3>Forgot Password?</h3>
                    <p class="text-secondaty">Enter your registered email address to reset your password.</p>
                </div>

                <div id="message"></div>

                <form id="forgotPasswordForm">
                    <div class="mb-3">
                        <label for="email" class="form-label"></label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">Send Reset Link</button>
                </form>

                <div class="text-center mt-4">
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../js/forgotPassword.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../../../styles.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <div class="main-title">
            <a href="../../../../index.html">Money Order</a>
        </div>
        <nav>
            <a href="../../../dashboard/pages/html/dashboard.html">Home</a>
            <a id="handle-accounts" href="../../../account/pages/html/handleAccounts.html">Manage Accounts</a>
            <a href='../../../auth/pages/html/login.html' id="logout">LogOut</a>
        </nav>
    </header>
    <main>
        <div>
           <div class="m-3 d-flex flex-row justify-content-between">
               <div>
                   <label for="searchInput"><i class="bi bi-search m-2"></i></label>
                   <input type="text" class="w-75 p-1 border border-dark border-1 rounded" id="searchInput" placeholder="Name, email, or account number..." />
               </div>
               <div>
                   <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#pendingRequestsModal" id="pendingRequestsButton">Pending Requests</button>
                   <div class="modal fade" id="pendingRequestsModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dilog-centerd modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Pending Account Requests</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <div id="pendingRequestsMessage" class="mb-3"></div>

                                    <div class="table-responsive">
                                        <table class="table table-hover align-middle">
                                            <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Email</th>
                                                <th class="text-center">Action</th>
                                            </tr>
                                            </thead>
                                            <tbody id="pendingRequestsTable">
                                            <tr>
                                                <td colspan="3" class="text-center">
                                                    Loading requests...
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                        </div>
                   </div>
               </div>
           </div>
            <div class="bg-light table-responsive m-3 border border-dark border-1 rounded">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Account Number</th>
                        <th>Account Holder</th>
                        <th>Balance</th>
                        <th>Account created at</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="accounts">
                    <tr>
                        <td colspan="5" class="text-center">
                            Loading Accounts...
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div id="accountsHistoryMessage"></div>
            </div>
        </div>

        <div class="d-flex justify-content-center align-items-center flex-wrap gap-3 my-4">
            <small id="paginationInfo" class="text-muted">
                Loading...
            </small>
            <nav aria-label="Account pagination">
                <ul class="pagination mb-0" id="pagination"></ul>
            </nav>
        </div>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="../js/handleAccounts.js" type="module"></script>
</body>
</html>

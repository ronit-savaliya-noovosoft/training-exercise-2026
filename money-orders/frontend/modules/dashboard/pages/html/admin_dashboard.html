<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../../../styles.css"/>
</head>
<body>
<div class="wrapper">
    <header>
        <div class="main-title">Money Order</div>
        <nav>
            <a href="#home">Home</a>
            <a href='../../../auth/pages/html/login.html' id="logout">LogOut</a>
        </nav>
    </header>
    <main>
        <div class="row gap-3 m-3">
            <div class="col-12 p-3 border border-dark border-1 rounded me-auto">
                <div class="">
                    <div id="avatar" class="avatar avatar-subtle theme-accent"></div>
                    <div id="user_name" class="fs-xl"></div>
                </div>
                <div id="user_email" class="fst-italic text-secondary mt-4"></div>
                <div id="user_role" class="fs-s fst-italic"></div>
            </div>
        </div>

        <div>
            <div class="bg-light table-responsive m-3 border border-dark border-1 rounded">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Type</th>
                        <th>Data</th>
                        <th>Attempts</th>
                        <th>Last Error</th>
                        <th>Created at</th>
                        <th>Updated at</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody id="jobs">
                    <tr>
                        <td colspan="7" class="text-center">
                            Loading Jobs...
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div id="jobHistoryMessage"></div>
            </div>
        </div>

        <div class="d-flex justify-content-center align-items-center flex-wrap gap-3 my-4">
            <small id="paginationInfo" class="text-muted">
                Loading...
            </small>
            <nav aria-label="Job pagination">
                <ul class="pagination mb-0" id="pagination"></ul>
            </nav>
        </div>
    </main>
    <footer>
    </footer>
</div>
<script src="../js/information.js" type="module"></script>
<script src="../js/jobs.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>

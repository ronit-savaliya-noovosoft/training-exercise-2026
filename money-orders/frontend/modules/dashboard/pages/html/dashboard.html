<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../../../../styles.css"/>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="main-title">Money Order</div>
            <nav>
                <a href="#home">Home</a>
<!--                <a href='../index.html'>Login</a>-->
                <a href='../../../auth/pages/html/login.html' id="logout">LogOut</a>
            </nav>
        </header>
        <main>
            <div class="container mt-4">
                <div class="row gap-3 mb-4">
                    <div class="col-12 col-md-5 p-3 border border-dark border-1 rounded me-auto">
                        <div class="">
                            <div id="avatar" class="avatar avatar-subtle theme-accent"></div>
                            <div id="user_name" class="fs-xl"></div>
                        </div>
                        <div id="user_email" class="fst-italic text-secondary mt-4"></div>
                        <div id="user_role" class="fs-s fst-italic"></div>
                    </div>
                    <div class="col-12 col-md-5 p-3 border border-dark border-1 rounded ms-auto">
                        <div>Account Number</div>
                        <div id="user_account" class="fs-lg text-secondary"></div>
                        <div class="mt-5">Current Balance</div>
                        <div id="balance-container">
                            <span id="accountBalance">******</span>
                            <a class="icon-link icon-link-hover" id="toggleBalance">
                                <svg xmlns="http://www.w3.org/2000/svg" class="bi" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                                </svg>
                            </a>
                            <span id="verify-balance-message"></span>
                        </div>
                    </div>
                </div>
                <div class="row gap-4">
                    <div class="col-12 col-md-5 border border-dark border-1 rounded pt-2 me-auto">
                        <div class="title h4">Deposit Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-deposit-to">To:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-deposit-to">

                                    </select>
                                </div>
                                <div class="dropdown-message mt-2"></div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="deposit-amount">Amount:</label>
                                <input type="number" class="form-control" id="deposit-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button id="deposit" class="btn btn-success">Deposit</button>
                            </div>
                        </form>
                        <div id="deposit-message"></div>
                    </div>
                    <div class="col-12 col-md-5 border border-dark border-1 rounded pt-2 ms-auto">
                        <div class="title h4">Withdrawal Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-withdraw-from">From:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-withdraw-from">

                                    </select>
                                </div>
                                <div class="dropdown-message mt-2"></div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="withdraw-amount">Amount:</label>
                                <input type="number" class="form-control" id="withdraw-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button class="btn btn-danger" id="withdraw">Withdraw</button>
                            </div>
                        </form>
                        <div id="withdraw-message"></div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12 col-md-12 border border-dark border-1 rounded pt-2">
                        <div class="title h4">Transfer Amount</div>
                        <form class="row gy-2 gx-3 my-3 align-items-center">
                            <div class="col-auto">
                                <label class="" for="select-transfer-from">From:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-transfer-from">

                                    </select>
                                </div>
                                <div class="dropdown-message mt-2"></div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="select-transfer-to">To:</label>
                                <div class="input-group">
                                    <div class="input-group-text">@</div>
                                    <select class="form-select dropdown" id="select-transfer-to">

                                    </select>
                                </div>
                                <div class="dropdown-message mt-2"></div>
                            </div>
                            <div class="col-auto">
                                <label class="" for="transfer-amount">Amount:</label>
                                <input type="number" class="form-control" id="transfer-amount" placeholder="XXX">
                            </div>
                            <div class="col-12">
                                <button id="transfer" class="btn btn-warning">Transfer</button>
                            </div>
                        </form>
                        <div id="transfer-message"></div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="row">
                        <div class="title h3 col-12 col-md-10">Transaction History</div>
                        <div class="col-12 col-md-2">
                            <!-- Button trigger modal -->
                            <button type="button" class="btn btn-primary transaction-email-section" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                                Email Transaction History
                            </button>

                            <!-- Modal -->
                            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="staticBackdropLabel">Email Transaction History</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <div class="row gap-2 form-field">
                                                <div class="col">
                                                    <label for="emailRecordLimit">Records</label>
                                                    <input type="number" class="form-control w-12" id="emailRecordLimit">

                                                    <label for="emailTransactionType">Transaction Type</label>
                                                    <select id="emailTransactionType" class="form-select">
                                                        <option value="all">All</option>
                                                        <option value="deposit">Deposit</option>
                                                        <option value="withdraw">Withdraw</option>
                                                        <option value="transfer">Transfer</option>
                                                    </select>
                                                </div>
                                                <div class="col">
                                                    <label for="emailFromDate">From date</label>
                                                    <input type="date" class="form-control w-12" id="emailFromDate">

                                                    <label for="emailToDate">To date</label>
                                                    <input type="date" class="form-control w-12" id="emailToDate">
                                                </div>

                                                <p id="emailHistoryMessage"></p>
                                            </div>

                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            <button type="button" class="btn btn-primary" id="emailHistoryButton">Sent</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-light table-responsive mt-3 border border-dark border-1 rounded">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="transactions">
                                <tr>
                                    <td colspan="5" class="text-center">
                                        Loading transactions...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div id="transactionHistoryMessage"></div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center align-items-center flex-wrap gap-3 my-4">
                <small id="paginationInfo" class="text-muted">
                    Loading...
                </small>
                <nav aria-label="Transaction pagination">
                    <ul class="pagination mb-0" id="pagination"></ul>
                </nav>
            </div>
        </main>
        <footer>
        </footer>
    </div>
    <script src="../js/init.js" type="module"></script>
    <script src="../js/information.js" type="module"></script>
    <script src="../js/accounts.js" type="module"></script>
    <script src="../js/transactions.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
